<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>wordy</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <main class="app">
    <header class="brand">
      <span class="logo">wordy</span>
      <span class="tagline">weaker &amp; stronger words</span>
    </header>

    <input id="query" class="query" type="text" placeholder="Type a noun or verb…"
           autocomplete="off" spellcheck="false" autofocus aria-label="Word to look up">

    <section id="empty" class="empty">
      <p>Try one of these:</p>
      <div id="examples" class="chips"></div>
    </section>

    <section id="result" class="result" hidden>
      <div id="senses" class="senses" role="tablist" aria-label="Meanings" hidden></div>

      <button id="pick" class="pick" type="button" title="Copy to clipboard">
        <span id="pick-word" class="pick-word"></span>
        <span id="pick-meta" class="pick-meta"></span>
      </button>

      <div id="slider" class="slider" role="slider" tabindex="0" aria-label="Intensity">
        <div id="track" class="track"></div>
        <div id="stops"></div>
        <div id="thumb" class="thumb"></div>
      </div>
      <div class="ends" aria-hidden="true"><span>weaker</span><span>stronger</span></div>

      <ol id="ladder" class="chips ladder"></ol>
      <p id="note" class="note" hidden></p>
    </section>

    <section id="fallback" class="fallback" hidden>
      <p id="fallback-title" class="fallback-title"></p>
      <p id="fallback-status" class="note"></p>
      <div id="synonyms" class="chips"></div>
    </section>

    <footer class="hint">
      <span><kbd>↑</kbd><kbd>↓</kbd> stronger / weaker</span>
      <span><kbd>Enter</kbd> copy</span>
    </footer>
  </main>
</body>
</html>
