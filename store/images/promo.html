<!doctype html>
<!-- Chrome Web Store small promo tile (440×280). -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>wordy promo tile</title>
  <style>
    :root {
      --ink: #1d1b18;
      --paper: #fbfaf7;
      --muted: #a39d93;
      --weak: #79a8e3;
      --strong: #f07a55;
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, ui-serif, serif;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
    body {
      display: flex; flex-direction: column; justify-content: center;
      padding: 0 36px;
      background:
        radial-gradient(260px 200px at 100% 0%, color-mix(in srgb, var(--strong) 22%, transparent), transparent 70%),
        radial-gradient(260px 200px at 0% 100%, color-mix(in srgb, var(--weak) 22%, transparent), transparent 70%),
        var(--ink);
      color: var(--paper);
      font-family: var(--sans);
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand img { width: 44px; height: 44px; }
    .brand span { font: 600 40px/1 var(--serif); letter-spacing: -0.01em; }
    p { margin: 12px 0 26px; color: var(--muted); font-size: 16px; }
    .words { display: flex; justify-content: space-between; font: 500 20px/1 var(--serif); }
    .words span:first-child { color: var(--weak); }
    .words span:nth-child(2) { color: var(--paper); }
    .words span:last-child { color: var(--strong); }
    .track { position: relative; height: 6px; margin-top: 14px; border-radius: 3px;
      background: linear-gradient(90deg, var(--weak), #57534c 50%, var(--strong)); }
    .track i { position: absolute; left: 50%; top: 50%; width: 18px; height: 18px;
      transform: translate(-50%, -50%); border-radius: 50%;
      background: var(--paper); border: 3px solid var(--ink); box-shadow: 0 0 0 2px var(--paper); }
  </style>
</head>
<body>
  <div class="brand"><img src="../../icons/icon128.png" alt=""><span>wordy</span></div>
  <p>Weaker and stronger words, one slide away.</p>
  <div class="words"><span>dislike</span><span>hate</span><span>loathe</span></div>
  <div class="track"><i></i></div>
</body>
</html>
