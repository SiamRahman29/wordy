<!doctype html>
<!--
  Chrome Web Store screenshot (1280×800). Renders the real popup in an iframe and
  drives it through the URL: ?word=hate&steps=2&sense=0&title=…&text=…&page=…
  Served over http by scripts/store-images.sh (ES modules don't load from file://).
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>wordy screenshot</title>
  <style>
    :root {
      --bg: #f3efe7;
      --ink: #1d1b18;
      --muted: #6f6a62;
      --line: #e4e0d8;
      --window: #ffffff;
      --chrome: #ebe7df;
      --weak: #5b8fd0;
      --strong: #e0603c;
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, ui-serif, serif;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    :root.dark {
      --bg: #141311;
      --ink: #f1eee8;
      --muted: #a39d93;
      --line: #3a3833;
      --window: #1f1e1b;
      --chrome: #2a2825;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; }
    body {
      display: grid;
      grid-template-columns: 430px 1fr;
      align-items: center;
      gap: 40px;
      padding: 0 56px 0 72px;
      background:
        radial-gradient(900px 500px at 100% 0%, color-mix(in srgb, var(--strong) 14%, transparent), transparent 70%),
        radial-gradient(700px 500px at 0% 100%, color-mix(in srgb, var(--weak) 14%, transparent), transparent 70%),
        var(--bg);
      color: var(--ink);
      font: 18px/1.5 var(--sans);
    }

    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 36px; }
    .brand img { width: 44px; height: 44px; }
    .brand span { font: 600 28px/1 var(--serif); }
    h1 { margin: 0 0 20px; font: 500 52px/1.08 var(--serif); letter-spacing: -0.02em; }
    .copy p { margin: 0; color: var(--muted); font-size: 20px; max-width: 24em; }
    .scale { margin-top: 36px; height: 8px; width: 200px; border-radius: 4px;
      background: linear-gradient(90deg, var(--weak), #d6d1c7 50%, var(--strong)); }

    .window {
      position: relative;
      height: 660px;
      border-radius: 14px;
      background: var(--window);
      box-shadow: 0 30px 80px rgb(0 0 0 / 0.18), 0 0 0 1px var(--line);
      overflow: hidden;
    }
    .toolbar {
      display: flex; align-items: center; gap: 14px;
      height: 52px; padding: 0 16px;
      background: var(--chrome);
      border-bottom: 1px solid var(--line);
    }
    .dots { display: flex; gap: 7px; }
    .dots i { width: 12px; height: 12px; border-radius: 50%; background: var(--line); }
    .address {
      flex: 1; height: 30px; border-radius: 15px; padding: 0 14px;
      background: var(--window); color: var(--muted); font-size: 13px; line-height: 30px;
    }
    .action { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center;
      background: color-mix(in srgb, var(--ink) 10%, transparent); }
    .action img { width: 18px; height: 18px; }

    article { padding: 44px 48px; max-width: 560px; font: 19px/1.7 var(--serif); color: var(--muted); }
    article h2 { margin: 0 0 18px; color: var(--ink); font: 600 28px/1.2 var(--serif); }
    article p { margin: 0 0 18px; }
    article mark { background: color-mix(in srgb, var(--weak) 35%, transparent); color: var(--ink); border-radius: 2px; }
    .fade { position: absolute; inset: auto 0 0 0; height: 120px;
      background: linear-gradient(transparent, var(--window)); }

    iframe {
      position: absolute; top: 58px; right: 12px;
      width: 360px; height: 400px; border: 0; border-radius: 12px;
      box-shadow: 0 18px 50px rgb(0 0 0 / 0.28), 0 0 0 1px var(--line);
      color-scheme: normal;
    }
  </style>
</head>
<body>
  <section class="copy">
    <div class="brand"><img src="../../icons/icon128.png" alt=""><span>wordy</span></div>
    <h1 id="title"></h1>
    <p id="text"></p>
    <div class="scale"></div>
  </section>

  <div class="window">
    <div class="toolbar">
      <div class="dots"><i></i><i></i><i></i></div>
      <div id="address" class="address"></div>
      <div class="action"><img src="../../icons/icon32.png" alt=""></div>
    </div>
    <article id="page"></article>
    <div class="fade"></div>
    <iframe id="popup" src="../../popup/popup.html"></iframe>
  </div>

  <script type="module">
    const params = new URLSearchParams(location.search);
    const get = (key, fallback = "") => params.get(key) ?? fallback;
    if (params.has("dark")) document.documentElement.classList.add("dark");

    document.getElementById("title").textContent = get("title");
    document.getElementById("text").textContent = get("text");

    // The page text, with the selected word marked: "…I [hate] this…".
    const page = document.getElementById("page");
    const [heading, ...paragraphs] = get("page").split("|");
    page.innerHTML = "<h2></h2>";
    page.querySelector("h2").textContent = heading;
    const slug = heading.toLowerCase().replace(/[^a-z]+/g, "-").replace(/^-|-$/g, "");
    document.getElementById("address").textContent = `example.com/${slug}`;
    for (const paragraph of paragraphs) {
      const p = document.createElement("p");
      for (const [i, part] of paragraph.split(/\[|\]/).entries()) {
        p.append(i % 2 ? Object.assign(document.createElement("mark"), { textContent: part }) : part);
      }
      page.append(p);
    }

    const frame = document.getElementById("popup");
    frame.addEventListener("load", async () => {
      const win = frame.contentWindow;
      const doc = frame.contentDocument;
      const query = doc.getElementById("query");
      query.value = get("word");
      query.dispatchEvent(new win.Event("input"));

      const sense = Number(get("sense", "0"));
      if (sense) doc.querySelectorAll(".sense")[sense]?.click();

      const steps = Number(get("steps", "0"));
      const key = steps > 0 ? "ArrowUp" : "ArrowDown";
      for (let i = 0; i < Math.abs(steps); i++) {
        query.dispatchEvent(new win.KeyboardEvent("keydown", { key, bubbles: true }));
      }
      query.blur();

      // Wait for the thumb's transition, then fit the frame to the popup.
      await new Promise((resolve) => setTimeout(resolve, 400));
      frame.style.height = `${doc.documentElement.scrollHeight}px`;
      document.body.dataset.ready = "";
    });
  </script>
</body>
</html>
